name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Build and run unit tests
        run: make test

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build Linux platform stub
        run: make build CC=${{ matrix.cc }}

  no-heap-no-syscall:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Verify portability guard
        run: make verify-portability CC=${{ matrix.cc }}

  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run replay tests
        run: make replay

  property-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run property tests
        run: make property

  property-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run property-command tests
        run: make property-command

  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run unit tests under ASan/UBSan
        run: make asan

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Run clang-tidy on core/
        run: make clang-tidy

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck on core/
        run: make cppcheck

  smoke-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run daemon smoke test
        run: make smoke

  integration-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run thermalcore-tune integration test
        run: make integration

  # Stage 11 11c: hardware-loop CAN integration.  Provisions vcan0,
  # builds the car-can-emulator submodule, drives speed via its TCP
  # port, asserts the daemon's filtered speed telemetry converges.
  # Per impl-plan section 5 Stage 11 a SKIP on the canonical repo
  # blocks the Stage 11 exit gate -- no continue-on-error.
  integration-can:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision vcan0
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip link show vcan0
      - name: Build car-can-emulator
        run: |
          cmake -S tools/car-can-emulator -B build/car-can-emulator
          cmake --build build/car-can-emulator
      - name: Build daemon
        run: make build
      - name: Run integration-can
        run: make integration-can

  fuzz-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run libFuzzer over the JSON loader (60 s)
        run: make fuzz-json FUZZ_CC=clang

  fuzz-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run libFuzzer over the wire decoder (60 s)
        run: make fuzz-wire FUZZ_CC=clang

  coverage:
    runs-on: ubuntu-latest
    # impl-plan section 3 row 9 / section 5 Stage 9: visibility only,
    # no gate.  A coverage-target failure should never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Generate coverage report
        run: make coverage
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/html/
          if-no-files-found: warn
