name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Build and run unit tests
        run: make test

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build Linux platform stub
        run: make build CC=${{ matrix.cc }}

  no-heap-no-syscall:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Verify portability guard
        run: make verify-portability CC=${{ matrix.cc }}

  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run replay tests
        run: make replay

  replay-parity-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host-side replay-parity check
        run: make replay-parity-host

  property-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run property tests
        run: make property

  property-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run property-command tests
        run: make property-command

  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run unit tests under ASan/UBSan
        run: make asan

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Run clang-tidy on core/
        run: make clang-tidy

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck on core/
        run: make cppcheck

  smoke-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run daemon smoke test
        run: make smoke

  integration-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run thermalcore-tune integration test
        run: make integration

  # Stage 11 11c: hardware-loop CAN integration.  Provisions vcan0,
  # builds the car-can-emulator submodule, drives speed via its TCP
  # port, asserts the daemon's filtered speed telemetry converges.
  # Per impl-plan section 5 Stage 11 a SKIP on the canonical repo
  # blocks the Stage 11 exit gate -- no continue-on-error.
  # Stage 12 12c: run every canonical .scn under scenarios/ on
  # ubuntu-latest.  Each scenario drives the C plant + daemon under
  # --clock=scenario and evaluates assertions against the captured
  # telemetry CSV.  Non-CAN scenarios only; the CAN-dependent
  # acoustic_mask + can_bus_loss scenarios land in 12d alongside
  # the determinism gate.
  scenario-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build daemon + libplant
        run: make build
      - name: Run canonical scenarios
        run: make scenario

  # Stage 12 12d: CAN-dependent canonical scenarios.  Provisions
  # vcan0 + builds car-can-emulator (same shape as integration-can
  # from Stage 11), then runs `make scenario` -- the CAN scenarios
  # auto-detect the iface and run for real instead of SKIPping.
  scenario-can-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision vcan0
        run: |
          # mid-2025 ubuntu-latest switched to an Azure-flavoured
          # kernel that ships without the vcan module in the base
          # image.  linux-modules-extra-<uname -r> carries it.
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip link show vcan0
      - name: Build car-can-emulator
        run: |
          cmake -S tools/car-can-emulator -B build/car-can-emulator
          cmake --build build/car-can-emulator
      - name: Build daemon + libplant
        run: make build
      - name: Run all scenarios (CAN scenarios run for real here)
        run: make scenario

  # Stage 12 12d: determinism gate (v1 Linux release-gate).
  # Mode A: same-build run-twice SHA-256.
  # Mode B: gcc-vs-clang SHA-256.
  # Q16.16 plant + --clock=scenario daemon + byte-stable CSV from
  # the probe must produce identical CSV bytes across runs and
  # across compilers.
  determinism-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run determinism gate
        run: make determinism

  integration-can:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision vcan0
        run: |
          # mid-2025 ubuntu-latest switched to an Azure-flavoured
          # kernel that ships without the vcan module in the base
          # image.  linux-modules-extra-<uname -r> carries it.
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip link show vcan0
      - name: Build car-can-emulator
        run: |
          cmake -S tools/car-can-emulator -B build/car-can-emulator
          cmake --build build/car-can-emulator
      - name: Build daemon
        run: make build
      - name: Run integration-can
        run: make integration-can

  fuzz-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run libFuzzer over the JSON loader (60 s)
        run: make fuzz-json FUZZ_CC=clang

  fuzz-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run libFuzzer over the wire decoder (60 s)
        run: make fuzz-wire FUZZ_CC=clang

  coverage:
    runs-on: ubuntu-latest
    # impl-plan section 3 row 9 / section 5 Stage 9: visibility only,
    # no gate.  A coverage-target failure should never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Generate coverage report
        run: make coverage
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/html/
          if-no-files-found: warn

  # Stage 13 13d / Stage 14 14d: ESP32-C3 firmware build matrix.
  # Builds the firmware in all three modes (STANDALONE +
  # REPLAY_STANDALONE + HIL_PERIPHERAL) inside the pinned ESP-IDF
  # docker image.  STANDALONE + HIL legs additionally enforce the
  # PRD section 9.2 size budgets (.text <= 64 KB, .bss <= 16 KB)
  # on the core/+protocol/ contribution to the linked firmware.
  # REPLAY skips the gate -- its LTO + --gc-sections dead-strip
  # is the most aggressive of the three modes (no thermal_core
  # step, no BSPs referenced) and the measurement would
  # understate the deployable footprint.
  #
  # Closes the Stage 13 exit gate (impl-plan section 5 line 471:
  # "all previous + build-esp32 green") and the Stage 14 exit
  # gate (impl-plan section 5 Stage 14: "HIL build green;
  # bench integration manual / nightly").
  build-esp32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [STANDALONE, REPLAY_STANDALONE, HIL_PERIPHERAL]
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware (${{ matrix.mode }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32c3
          path: platform/esp32_idf
          command: |
            case "${{ matrix.mode }}" in
              REPLAY_STANDALONE)
                idf.py reconfigure -DTHERMALCORE_REPLAY_STANDALONE=ON
                ;;
              HIL_PERIPHERAL)
                idf.py reconfigure -DTHERMALCORE_HIL_PERIPHERAL=ON
                ;;
            esac
            idf.py build
            idf.py size-files --format json \
                --output-file build/size-files.json
      - name: Set up Python for size-budget script
        if: matrix.mode != 'REPLAY_STANDALONE'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce PRD section 9.2 size budget
        if: matrix.mode != 'REPLAY_STANDALONE'
        run: python3 tools/check_esp32_size_budget.py
            platform/esp32_idf/build/size-files.json
      # Stage 15 15d: keep the per-mode firmware size measurement as
      # a CI artifact so footprint can be tracked over time.
      - name: Upload firmware size measurement
        uses: actions/upload-artifact@v4
        with:
          name: size-files-${{ matrix.mode }}
          path: platform/esp32_idf/build/size-files.json
          if-no-files-found: error
