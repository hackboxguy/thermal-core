name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        run: make test

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build Linux platform stub
        run: make build CC=${{ matrix.cc }}
